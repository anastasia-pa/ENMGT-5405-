[project]
name = "mcp-productivity"
version = "0.1.0"
description = "A local MCP server for productivity tools."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.2.0",
    "python-dotenv>=1.2.3",
]

# This is an application, not an installable library, so uv should not try to build it.
[tool.uv]
package = false
